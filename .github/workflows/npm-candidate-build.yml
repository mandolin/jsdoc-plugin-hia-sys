name: npm Candidate Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-candidate-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    # <lang lang="zh-CN">统一清单和构建逻辑固定于同一提交，使用本仓来源。</lang><lang lang="en">Pin the shared plan and build logic to one revision and use this repository's sources.</lang>
    if: github.ref == 'refs/heads/main'
    uses: mandolin/HIA-Documentation/.github/workflows/build-npm-candidate.yml@52c31f94f3622f9858d6f9d450a153652917e7dd
    with:
      plan_revision: 52c31f94f3622f9858d6f9d450a153652917e7dd
