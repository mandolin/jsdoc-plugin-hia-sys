name: npm Trusted Publish

on:
  push:
    branches: [main, release/w-p157-stable-entry]
    paths: [".github/workflows/npm-trusted-publish.yml"]
  workflow_dispatch:
    inputs:
      operation:
        description: Select a coordinated audit or publication
        type: choice
        required: true
        default: stable-audit
        options:
          - stable-audit
          - stable-publish
          - candidate-audit
          - candidate-publish
      package_name:
        description: Exact package name; leave empty only to audit all owned packages
        required: false
        type: string
      confirm_publish:
        description: Exact confirmation for a separately approved publication
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: npm-trusted-publish-${{ inputs.package_name }}
  cancel-in-progress: false

jobs:
  stable:
    # <lang lang="zh-CN">推送只运行审计，正式写入另需默认分支的显式调度和波次授权。</lang><lang lang="en">Pushes only audit; publication requires explicit dispatch from main and wave authorization.</lang>
    if: github.event_name == 'push' || inputs.operation == 'stable-audit' || inputs.operation == 'stable-publish'
    uses: mandolin/HIA-Documentation/.github/workflows/publish-npm-stable.yml@dabd25c31ccc8b07e9a6fb18065bc676d99bd6cb
    with:
      release_revision: dabd25c31ccc8b07e9a6fb18065bc676d99bd6cb
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'stable-publish' && 'publish' || 'audit' }}
      package_name: ${{ inputs.package_name }}
      confirmation: ${{ inputs.confirm_publish }}

  candidate:
    # <lang lang="zh-CN">只使用全局已核对的归档和审批入口。</lang><lang lang="en">Use the coordinated verified archive and approval path.</lang>
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'candidate-audit' || inputs.operation == 'candidate-publish')
    uses: mandolin/HIA-Documentation/.github/workflows/publish-npm-candidate.yml@92cc4eed219e2f7e846f91f3e6674f4b79233eb8
    with:
      release_revision: 92cc4eed219e2f7e846f91f3e6674f4b79233eb8
      mode: ${{ inputs.operation == 'candidate-audit' && 'audit' || 'publish' }}
      package_name: ${{ inputs.package_name }}
      confirmation: ${{ inputs.confirm_publish }}
